[project]
name = "tio-shacl"
version = "1.0.0"
description = "SHACL shapes and validation framework for the TM Forum Intent Ontology (TIO) v3.6.0"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "tio-shacl contributors" }]
keywords = ["rdf", "shacl", "ontology", "intent", "tmforum", "tio", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "rdflib>=7.1.4",
    "pyshacl>=0.30.1",
    "psutil>=6.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
mcp = [
    "fastmcp>=0.2.0",
]

[project.scripts]
tio-shacl = "tio_shacl.cli:main"
tio-shacl-mcp = "tio_shacl.mcp_server:main"
tio-shacl-api = "tio_shacl.api:main"

[project.urls]
Homepage = "https://www.tmforum.org/intent"
Repository = "https://github.com/earejma/tio-shacl"
Issues = "https://github.com/earejma/tio-shacl/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tio_shacl"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"rdf" = "tio_shacl/rdf"
"extensions" = "tio_shacl/extensions"
"test-cases" = "tio_shacl/test-cases"
"sparql" = "tio_shacl/sparql"
"patches" = "tio_shacl/patches"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/rdf",
    "/extensions",
    "/test-cases",
    "/sparql",
    "/patches",
    "/scripts",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
    "java_wrappers",
    "ontology",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E203",  # whitespace before ':'
    "B008",  # function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.isort]
known-first-party = ["tio_shacl"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests (require TIO ontology)",
    "slow: Slow running tests",
    "java: Tests requiring Java validators (TopBraid/Jena)",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.12.0",
    "mypy>=1.12.0",
    "pre-commit>=4.1.0",
]
